        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:latest \
            .

      # Push Docker image
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:latest


  # =========================================================
  # ORDER SERVICE
  # =========================================================
  order-service:
    name: Order Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: order-service

