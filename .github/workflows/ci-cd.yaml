name: E-Commerce Platform with Microservices Architecture - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # PRODUCT SERVICE
  # =========================================================
  product-service:
    name: Product Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product-service

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product-service/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run tests
      - name: Run tests
        run: npm test --if-present

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest \
            .

      # Push Docker image
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest


  # =========================================================
  # CART SERVICE
  # =========================================================
  cart-service:
    name: Cart Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cart-service

