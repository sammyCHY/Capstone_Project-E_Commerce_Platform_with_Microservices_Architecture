name: E-Commerce_Platform_with_Microservices_Architecture-CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # --------------------------------------------------
  # 2. Configure AWS credentials
  # --------------------------------------------------
  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ env.AWS_REGION }}

  # ==========================
  # PRODUCT SERVICE
  # ==========================
  product-service:
    name: Product Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest


  # ==========================
  # CART SERVICE
  # ==========================
  cart-service:
    name: Cart Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cart-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cart-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:latest \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cart-service:latest


  # ==========================
  # ORDER SERVICE
  # ==========================
  order-service:
    name: Order Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: order-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest